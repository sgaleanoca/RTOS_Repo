<!DOCTYPE html>
<html>
<head>
    <meta charset='UTF-8'>
    <title>Control de LEDs</title>
    <link rel="stylesheet" href="/styles.css">
</head>
<body>
    <h1>Controlar LEDs desde ESP32</h1>
    <p>LED Amarillo: <span id="estadoAmarillo">%s</span></p>
    <form action='/toggleAmarillo' method="GET">
        <button type="submit">Encender/Apagar Amarillo</button>
    </form>
    <p>LED Azul: <span id="estadoAzul">%s</span></p>
    <form action='/toggleAzul' method="GET">
        <button type="submit">Encender/Apagar Azul</button>
    </form>
    <p>Ambos LEDs:</p>
    <form action='/toggleAmbos' method="GET">
        <button type="submit">Encender/Apagar Ambos</button>
    </form>
    <script src="/script.js"></script>
</body>
</html>
